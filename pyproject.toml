[project]
name = "covenant-gate0"
version = "0.1.0"
description = "DataHub-backed Gate 0 feasibility proof for Covenant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "acryl-datahub==1.6.0",
  "mcp-server-datahub==0.6.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
