[project]
name = "covenant-native-semantic-graph"
version = "0.4.0"
description = "Evidence-bound DataHub change-to-action agent for Covenant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "acryl-datahub==1.6.0",
  "boto3==1.43.51",
  "fastapi==0.139.2",
  "jsonschema==4.26.0",
  "mcp-server-datahub==0.6.0",
  "PyYAML==6.0.3",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
